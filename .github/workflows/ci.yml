name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_FRAPPE_BASE_URL: ${{ secrets.NEXT_PUBLIC_FRAPPE_BASE_URL }}
          # Admin API credentials (server-side only)
          FRAPPE_ADMIN_API_KEY: ${{ secrets.FRAPPE_ADMIN_API_KEY }}
          FRAPPE_ADMIN_API_SECRET: ${{ secrets.FRAPPE_ADMIN_API_SECRET }}
          # App API credentials (server-side only)
          FRAPPE_APP_API_KEY: ${{ secrets.FRAPPE_APP_API_KEY }}
          FRAPPE_APP_API_SECRET: ${{ secrets.FRAPPE_APP_API_SECRET }}

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful - .next directory created"
            ls -la .next
          else
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
