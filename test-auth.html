<!DOCTYPE html>
<html>
<head>
    <title>Frappe API Authentication Test</title>
</head>
<body>
    <h1>Frappe API Authentication Test</h1>
    <button onclick="testPing()">Test frappe.ping</button>
    <button onclick="testTickets()">Test HD Ticket endpoint</button>
    <pre id="results"></pre>

    <script>
    const apiKey = '143684ef3bb7944';
    const apiSecret = '1cedb0a9d0c9309'; // Current secret from .env.local
    
    function log(message) {
        document.getElementById('results').textContent += message + '\n';
    }

    async function testPing() {
        log('\n=== Testing frappe.ping ===');
        log('Testing authentication...');
        
        try {
            const response = await fetch('https://intern-dev.frappe.cloud/api/method/frappe.ping', {
                method: 'GET',
                headers: {
                    'Authorization': `token ${apiKey}:${apiSecret}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }
            });
            
            log('Status: ' + response.status);
            const text = await response.text();
            log('Response: ' + text);
        } catch (error) {
            log('Error: ' + error.message);
        }
    }

    async function testTickets() {
        log('\n=== Testing HD Ticket endpoint ===');
        
        try {
            const response = await fetch('https://intern-dev.frappe.cloud/api/resource/HD Ticket', {
                headers: {
                    'Authorization': `token ${apiKey}:${apiSecret}`,
                    'Content-Type': 'application/json'
                }
            });
            
            log('Status: ' + response.status);
            const text = await response.text();
            log('Response: ' + text.substring(0, 500) + (text.length > 500 ? '...' : ''));
        } catch (error) {
            log('Error: ' + error.message);
        }
    }
    </script>
</body>
</html>
